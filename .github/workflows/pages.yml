name: pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the tool cards hotlink demo GIFs and docs from sibling repos,
    # which can move without a push here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy mid-flight; superseded PR runs are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # crates.io serves 404 to clients that don't ask for HTML.
          args: >-
            --no-progress
            --header 'Accept: text/html'
            --exclude '^https://brevity1swos\.github\.io/'
            index.html README.md docs/gaps.md
          fail: true

  deploy:
    needs: links
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Publish only the page itself, not README.md / docs/ as Jekyll output.
      - run: mkdir _site && cp index.html style.css _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
